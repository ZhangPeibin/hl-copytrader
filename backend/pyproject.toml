[project]
name = "hlcopy"
version = "0.1.0"
description = "Personal Hyperliquid copy-trading site"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=43",
    "eth-account>=0.13",
    "fastapi>=0.115",
    "requests>=2.32",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hlcopy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
